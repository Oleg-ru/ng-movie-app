<div class="movie-card">
  <img [src]="'https://media.themoviedb.org/t/p/w440_and_h660_face' + movie()?.poster_path"
       (error)="handleImageError($event)"
       class="card-img"
   alt="карточка">
  <div class="title">
    {{getTitle(movie())}}
  </div>
  <div class="release-date">
    {{getDate(movie())}}
  </div>
</div>
